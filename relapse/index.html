<!DOCTYPE html>
<html lang="en" manifest="cache.manifest">
<head>
  <meta charset="utf-8">
  <title>PS5-Relapse</title>
  <style>
    html, body {
      background: #060606;
      color: #fff;
    }
  </style>
</head>
<body>

  <div id="console"></div>
  <script src="./src/firmware.js"></script>
  <script src="./src/main.js"></script>
  <script src="./src/rop.js"></script>
  <script src="./src/utils/syscalls.js"></script>
  <script type="module" src="./src/site.js"></script>

  <script>
    function registerAppCacheEventHandlers() {
      if (!window.applicationCache) {
        console.warn('AppCache API non disponibile su questo WebKit');
        return;
      }
      const ac = window.applicationCache;
      ac.addEventListener('updateready', () => ac.swapCache());
      ac.addEventListener('error', (e) => console.error('AppCache error', e));
      ac.addEventListener('cached', () => console.log('AppCache: cached'));
      ac.addEventListener('noupdate', () => console.log('AppCache: noupdate'));
    }

    registerAppCacheEventHandlers();
  </script>
</body>
</html>
